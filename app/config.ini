# M3U Editor - settings
#
# Every key is optional; delete a line to go back to its default.
# A stock muOS install needs no configuration at all.

# Where to look for .m3u playlists, comma separated. All of these are scanned
# and the results combined.
#playlist_dirs=/mnt/sdcard/ROMS/IPTV,/mnt/sdcard/ROMS/VIDEO/IPTV,/mnt/mmc/ROMS/IPTV

# What a disabled line is prefixed with. Anything that makes the line a comment
# to your player works; change it only if your playlists already contain #OFF#
# as real content.
#marker=#OFF#

# How many entries L1 enables, counting from the cursor.
#grab_count=5
